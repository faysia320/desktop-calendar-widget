[package]
name = "desktop-calendar-widget"
version = "0.1.0"
description = "Desktop calendar widget for Google and Outlook calendars"
authors = ["Rocket"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_calendar_widget_lib"
# This Windows desktop app only links the Rust library into its executable.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "time", "sync"] }
url = "2"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
roxmltree = "0.21.2"
scraper = "0.29"


# Fast repeatable desktop builds. UI assets are embedded, so every UI change
# relinks this crate; fat LTO made even a CSS change take several minutes.
[profile.release]
codegen-units = 16
lto = false
opt-level = 2
incremental = true
panic = "abort"
strip = true

# Optional size-focused distribution build, not used for routine updates.
[profile.distribution]
inherits = "release"
codegen-units = 1
lto = "thin"
opt-level = 3
incremental = false
